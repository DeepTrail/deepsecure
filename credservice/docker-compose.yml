version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: deepsecure_credservice_db
    environment:
      POSTGRES_USER: deepsecure_user
      POSTGRES_PASSWORD: deepsecure_password
      POSTGRES_DB: credservicedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Expose on 5433 to avoid conflict if local pg is on 5432
    networks:
      - deepsecure_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U deepsecure_user -d credservicedb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  credservice:
    build: .
    container_name: deepsecure_credservice_app
    ports:
      - "8001:8001"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://deepsecure_user:deepsecure_password@db/credservicedb
      - SECRET_KEY=your-secret-key-for-jwt
      - BACKEND_API_TOKEN=DEFAULT_QUICKSTART_TOKEN

      # This tells the service where to find the policy file we mounted below.
      - POLICY_PATH=/app/policies.yml
      
      # Other app settings
      - ALGORITHM=HS256
      - POSTGRES_DRIVER=psycopg2
      
    volumes:
      # Mount the policies file into the container to make it accessible to the service.
      # The ':ro' makes the file read-only inside the container for better security.
      - ./policies.yml:/app/policies.yml:ro
      
    networks:
      - deepsecure_network

volumes:
  postgres_data:

networks:
  deepsecure_network:
    driver: bridge
