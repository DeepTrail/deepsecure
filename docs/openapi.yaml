  # Gateway health endpoint  
  /health:
    get:
      summary: Health Check
      description: |
        Comprehensive health check endpoint for the DeepSecure Gateway service.
        Returns service status and dependency connectivity (Control Plane and Redis).
      tags: [Gateway]
      security: []
      servers:
        - url: http://localhost:8002
          description: Gateway - Runtime Operations (Local Development)
        - url: https://gateway.deepsecure.yourdomain.com
          description: Gateway - Runtime Operations (Production)
      responses:
        '200':
          description: Gateway is healthy with all dependencies connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: "DeepSecure Gateway"
                  version:
                    type: string
                    example: "0.1.10"
                  status:
                    type: string
                    example: "ok"
                  dependencies:
                    type: object
                    properties:
                      control_plane:
                        type: string
                        example: "connected"
                      redis:
                        type: string
                        example: "connected"
  
  /ready:
    get:
      summary: Readiness Check  
      description: |
        Kubernetes-style readiness check for the Gateway.
        Returns 200 when ready to accept requests, 503 when not ready.
      tags: [Gateway]
      security: []
      servers:
        - url: http://localhost:8002
          description: Gateway - Runtime Operations (Local Development)
        - url: https://gateway.deepsecure.yourdomain.com
          description: Gateway - Runtime Operations (Production)
      responses:
        '200':
          description: Gateway is ready to accept requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ready"
                  message:
                    type: string
                    example: "Gateway is ready to accept requests"
        '503':
          description: Gateway is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "not_ready"
                  message:
                    type: string
                    example: "Gateway is not ready to accept requests"
                  error:
                    type: string
                    example: "Control plane unreachable"
  
  /metrics:
    get:
      summary: Gateway Metrics
      description: |
        Basic metrics endpoint for monitoring and observability.
        Returns operational metrics for the gateway service.
      tags: [Gateway - Monitoring]
      security: []
      servers:
        - url: http://localhost:8002
          description: Gateway - Runtime Operations (Local Development)
        - url: https://gateway.deepsecure.yourdomain.com
          description: Gateway - Runtime Operations (Production)
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests_processed:
                    type: integer
                    example: 1250
                  gateway_status:
                    type: integer
                    example: 1
                    description: 1 if healthy, 0 if unhealthy
                  version:
                    type: string
                    example: "0.1.10"
                  proxy_type:
                    type: string
                    example: "deeptrail_gateway"
        '500':
          description: Error collecting metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error collecting metrics"
  
  /config:
    get:
      summary: Gateway Configuration
      description: |
        Get current gateway configuration settings.
        Useful for debugging and operational visibility.
      tags: [Gateway - Configuration]
      security: []
      servers:
        - url: http://localhost:8002
          description: Gateway - Runtime Operations (Local Development)
        - url: https://gateway.deepsecure.yourdomain.com
          description: Gateway - Runtime Operations (Production)
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  proxy_type:
                    type: string
                    example: "deeptrail_gateway"
                  routing:
                    type: object
                    properties:
                      target_header:
                        type: string
                        example: "X-Target-Base-URL"
                      path_prefix:
                        type: string
                        example: "/proxy"
                  authentication:
                    type: object
                    properties:
                      jwt_validation:
                        type: boolean
                        example: true
                  logging:
                    type: object
                    properties:
                      enable_request_logging:
                        type: boolean
                        example: true
                      log_level:
                        type: string
                        example: "INFO"
  /logging/stats:
    get:
      summary: Gateway Logging Stats
      tags: [Gateway - Monitoring]
      security: []
      servers:
        - url: http://localhost:8002
        - url: https://gateway.deepsecure.yourdomain.com
      responses:
        '200':
          description: Logging stats
          content:
            application/json:
              schema:
                type: object
  /logging/config:
    get:
      summary: Gateway Logging Config
      tags: [Gateway - Monitoring]
      security: []
      servers:
        - url: http://localhost:8002
        - url: https://gateway.deepsecure.yourdomain.com
      responses:
        '200':
          description: Logging configuration
          content:
            application/json:
              schema:
                type: object
  /logging/active:
    get:
      summary: Gateway Active Requests
      tags: [Gateway - Monitoring]
      security: []
      servers:
        - url: http://localhost:8002
        - url: https://gateway.deepsecure.yourdomain.com
      responses:
        '200':
          description: Active request information
          content:
            application/json:
              schema:
                type: object
  
  # Main proxy endpoint
  /proxy/{path}:
    get:
      summary: Proxy GET Request
      description: |
        Proxy GET requests to external services with automatic secret injection.
        The target URL is specified via the X-Target-Base-URL header.
        Note: X-Target-Base-URL is treated as a base URL; the final upstream URL is composed as:
        <base>.rstrip('/') + '/' + {path}.lstrip('/').
      tags: [Gateway - Proxy]
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:8002
          description: Gateway - Runtime Operations (Local Development)
        - url: https://gateway.deepsecure.yourdomain.com
          description: Gateway - Runtime Operations (Production)
      parameters:
        - name: path
          in: path
          required: true
          description: The path component to append to the target URL
          schema:
            type: string
            example: "v1/chat/completions"
        - name: X-Target-Base-URL
          in: header
          required: true
          description: The base URL of the target service
          schema:
            type: string
            example: "https://api.openai.com"
        - name: Authorization
          in: header
          required: true
          description: Bearer JWT token from the Control Plane
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIs..."
      responses:
        '200':
          description: Request proxied successfully
          content:
            application/json:
              schema:
                type: object
                description: Response from the target service
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid proxy request or missing required headers
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid proxy request"
                  message:
                    type: string
                    example: "X-Target-Base-URL header is required"
                  required_header:
                    type: string
                    example: "X-Target-Base-URL"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Access denied by policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "access_denied"
                  message:
                    type: string
                    example: "Agent not authorized to access this resource"
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      summary: Proxy POST Request
      description: |
