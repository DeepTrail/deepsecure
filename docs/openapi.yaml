openapi: 3.0.3
info:
  title: DeepSecure API - Dual Service Architecture
  description: |
    # DeepSecure Python SDK & Services API
    
    DeepSecure provides a comprehensive zero-trust security control plane for AI agents through a dual-service architecture:
    
    ## 🧠 **Control Plane (`deeptrail-control`)** 
    **Port 8000** - Policy Decision Point (PDP) and agent management
    
    - **Agent Identity Management**: Create, manage, and authenticate AI agents with Ed25519 cryptographic identities
    - **Authentication & Authorization**: Challenge-response authentication, JWT token issuance with claims
    - **Policy Engine**: Define and manage fine-grained access policies for agents  
    - **Credential Issuance**: Issue ephemeral, time-bound access tokens for external services
    - **Agent Bootstrapping**: Bootstrap agent identities from cloud platforms (K8s, AWS, Azure, Docker)
    - **Audit & Compliance**: Comprehensive logging of all security events
    
    ## 🚀 **Data Plane (`deeptrail-gateway`)**
    **Port 8002** - Policy Enforcement Point (PEP) and runtime operations
    
    - **Request Proxying**: Transparent proxy for all agent external API calls
    - **Secret Injection**: Automatic injection of API keys and credentials at runtime
    - **Policy Enforcement**: Real-time access control based on JWT claims and policies
    - **Split-Key Security**: JIT (Just-In-Time) secret reassembly for enhanced security
    - **Rate Limiting & Filtering**: Request validation, sanitization, and throttling
    
    ## 🔧 **Authentication & Security**
    
    - **Agent Authentication**: Ed25519 signature-based challenge-response flow
    - **API Key Authentication**: Bearer token authentication for CLI and administrative operations
    - **JWT Tokens**: Claims-based authorization with agent permissions and resource scoping
    - **Split-Key Architecture**: Secrets are split between Control Plane and Gateway for enhanced security
    
    ## 📋 **Core Workflows**
    
    1. **Agent Registration**: Register agent with public key → Get agent ID
    2. **Authentication**: Request challenge → Sign nonce → Exchange for JWT
    3. **Runtime Operations**: Use JWT → Gateway validates → Access external APIs with injected secrets
    4. **Policy Management**: Define policies → Apply to agents → Enforce at gateway
    5. **Audit & Monitoring**: All actions logged → Compliance reporting
    
    ## 🌐 **Service URLs**
    - **Control Plane**: `http://localhost:8000/api/v1/` (Management operations)
    - **Gateway**: `http://localhost:8002/` (Runtime operations, proxying)
    - **Production**: Replace localhost with your deployed service URLs
  version: "0.1.11"
  contact:
    name: DeepSecure Support
    url: https://github.com/DeepTrail/deepsecure
    email: mahendra@deeptrail.com
  license:
    name: Apache 2.0
    url: https://opensource.org/licenses/Apache-2.0

servers:
  - url: http://localhost:8000/api/v1
    description: Control Plane - Management Operations (Local Development)
  - url: http://localhost:8002
    description: Gateway - Runtime Operations (Local Development)
  - url: https://control.deepsecure.yourdomain.com/api/v1
    description: Control Plane - Management Operations (Production)
  - url: https://gateway.deepsecure.yourdomain.com
    description: Gateway - Runtime Operations (Production)

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ===== CONTROL PLANE ENDPOINTS =====
  
  # --- Health & Status ---
  /control/health:
    get:
      summary: Health Check
      description: |
        Health check endpoint for the DeepSecure Control Plane service.
        Returns service status and database connectivity information.
      tags: [Control Plane]
      security: []
      responses:
        '200':
          description: Control Plane is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: "DeepSecure Control Plane"
                  version:
                    type: string
                    example: "0.1.10"
                  status:
                    type: string
                    example: "ok"
                  dependencies:
                    type: object
                    properties:
                      database:
                        type: string
                        example: "connected"
  
  # --- Agent Management ---
  /agents:
    get:
      summary: List Agents
      description: |
        Retrieve a paginated list of registered agents.
        Supports pagination with skip/limit parameters.
      tags: [Agents]
      parameters:
        - name: skip
          in: query
          description: Number of records to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: List of agents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      summary: Register New Agent
      description: |
        Register a new AI agent in the system with its Ed25519 public key.
        The agent_id will be automatically generated if not provided.
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Agent with this public key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /agents/{agent_id}:
    get:
      summary: Get Agent by ID
      description: Retrieve detailed information about a specific agent.
      tags: [Agents]
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The unique agent identifier
          schema:
            type: string
            example: "agent-ebd9cd4a-1234-5678-90ab-cdef01234567"
      responses:
        '200':
          description: Agent details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update Agent
      description: Partially update an agent's properties.
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The unique agent identifier
          schema:
            type: string
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete (Deactivate) Agent
      description: Deactivate or delete an agent by ID.
      tags: [Agents]
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The unique agent identifier
          schema:
            type: string
      responses:
        '200':
          description: Agent deleted or deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  # --- Authentication & Authorization ---
  /auth/challenge:
    post:
      summary: Request Authentication Challenge
      description: |
        Generate and return a single-use challenge nonce that the agent must sign
        with its private key to prove identity ownership.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Challenge nonce generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /auth/token:
    post:
      summary: Exchange Signed Challenge for JWT
      description: |
        Authenticate an agent by verifying a signed nonce and return a JWT access token
        with embedded permissions and resource scopes.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: JWT token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Invalid or expired nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid signature or authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /auth/delegate:
    post:
      summary: Delegate Access to Another Agent
      description: |
        Allow an authenticated agent to generate a temporary, scoped credential (macaroon)
        and delegate it to another agent for specific resources and permissions.
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationRequest'
      responses:
        '200':
          description: Delegation token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized to delegate this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  # --- Bootstrap Endpoints ---
  /auth/bootstrap/kubernetes:
    post:
      summary: Bootstrap Agent Identity from Kubernetes
      description: |
        Bootstrap an agent identity using a Kubernetes Service Account Token (SAT).
        This allows agents running in Kubernetes to automatically obtain cryptographic identities.
      tags: [Bootstrap]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesBootstrapRequest'
      responses:
        '200':
          description: Agent identity bootstrapped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapError'
        '403':
          description: Policy not found for this workload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /auth/bootstrap/aws:
    post:
      summary: Bootstrap Agent Identity from AWS
      description: |
        Bootstrap an agent identity using an AWS STS GetCallerIdentity token.
        This allows agents running in AWS to automatically obtain cryptographic identities.
      tags: [Bootstrap]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AWSBootstrapRequest'
      responses:
        '200':
          description: Agent identity bootstrapped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /auth/bootstrap/azure:
    post:
      summary: Bootstrap Agent Identity from Azure
      description: |
        Bootstrap an agent identity using an Azure Managed Identity token.
        This allows agents running in Azure to automatically obtain cryptographic identities.
      tags: [Bootstrap]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureBootstrapRequest'
      responses:
        '200':
          description: Agent identity bootstrapped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /auth/bootstrap/docker:
    post:
      summary: Bootstrap Agent Identity from Docker
      description: |
        Bootstrap an agent identity using Docker container metadata.
        This allows agents running in Docker containers to automatically obtain cryptographic identities.
      tags: [Bootstrap]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockerBootstrapRequest'
      responses:
        '200':
          description: Agent identity bootstrapped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  # --- Vault & Credential Management ---
  /vault/store:
    post:
      summary: Store Secret in Vault
      description: |
        Store or update a secret in the DeepSecure vault.
        Secrets are used for secure API key management and injection at runtime.
      tags: [Vault]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretStoreRequest'
      responses:
        '201':
          description: Secret stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretStoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /vault/secrets:
    get:
      summary: List Secrets
      description: List secrets from the vault (admin/CLI use).
      tags: [Vault]
      responses:
        '200':
          description: Secrets listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /vault/secrets/{name}:
    get:
      summary: Retrieve Secret by Name
      description: |
        Retrieve a secret directly from the vault by name.
        This is for administrative/CLI use and bypasses the ephemeral credential system.
      tags: [Vault]
      parameters:
        - name: name
          in: path
          required: true
          description: The secret name
          schema:
            type: string
            example: "openai-api-key"
      responses:
        '200':
          description: Secret retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "openai-api-key"
                  value:
                    type: string
                    example: "sk-..."
                  created_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /vault/credentials:
    post:
      summary: Issue Ephemeral Credential
      description: |
        Issue an ephemeral, time-bound access credential for an agent.
        The credential contains the necessary permissions and can be used to access external services.
      tags: [Vault]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialIssueRequest'
      responses:
        '201':
          description: Credential issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Agent is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /vault/credentials/{credential_id}/revoke:
    post:
      summary: Revoke Credential
      description: |
        Revoke an existing credential by setting its revoked_at timestamp.
        This immediately invalidates the credential across all services.
      tags: [Vault]
      parameters:
        - name: credential_id
          in: path
          required: true
          description: The credential ID to revoke
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credential revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRevokeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /vault/credentials/{credential_id}/verify:
    get:
      summary: Verify Credential
      description: Verify whether a credential is valid or revoked.
      tags: [Vault]
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  # --- Policy Management ---
  /policies:
    get:
      summary: List Policies
      description: |
        Retrieve a list of access control policies defined in the system.
        Policies control which agents can access which resources.
      tags: [Policies]
      parameters:
        - name: skip
          in: query
          description: Number of records to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: List of policies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /policies/{policy_id}:
    get:
      summary: Get Policy by ID
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete Policy
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create Policy
      description: Create a new access control policy.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreate'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /policies/attestation:
    get:
      summary: List Attestation Policies
      description: |
        Retrieve a list of attestation policies used for agent bootstrapping.
        These policies control which workloads can bootstrap agent identities.
      tags: [Policies]
      parameters:
        - name: skip
          in: query
          description: Number of records to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: List of attestation policies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttestationPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create Attestation Policy
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationPolicy'
      responses:
        '201':
          description: Attestation policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /policies/attestation/{policy_id}:
    get:
      summary: Get Attestation Policy by ID
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attestation policy retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update Attestation Policy
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationPolicy'
      responses:
        '200':
          description: Attestation policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete Attestation Policy
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attestation policy deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  # --- Internal Endpoints (Service-to-Service) ---
  /internal/secrets/{secret_name}/share:
    get:
      summary: Get Secret Share (Internal)
      description: |
        Internal endpoint for the gateway to retrieve the control plane's share of a secret.
        This is part of the split-key security architecture.
      tags: [Control Plane - Internal]
      security:
        - InternalApiKey: []
      parameters:
        - name: secret_name
          in: path
          required: true
          description: The name of the secret
          schema:
            type: string
      responses:
        '200':
          description: Secret share retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_1:
                    type: string
                    description: Control plane's share of the secret
                  target_base_url:
                    type: string
                    description: Target URL for this secret (if configured)
                    nullable: true
        '401':
          description: Invalid or missing internal API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/shares:
    post:
      summary: Ingest Secret Share (Internal)
      description: Internal endpoint for the control plane to push share_2 to gateway.
      tags: [Gateway - Internal]
      security:
        - InternalApiKey: []
      servers:
        - url: http://localhost:8002
        - url: https://gateway.deepsecure.yourdomain.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret_name:
                  type: string
                share_value:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Share stored
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  # ===== GATEWAY ENDPOINTS =====
  
  # Gateway endpoints use different server base URL (port 8002)
  # Health endpoints
  # /:
  #   get:
  #     summary: Gateway Root Health Check
  #     description: Basic health check endpoint for the DeepSecure Gateway service.
  #     tags: [Gateway - Health]
  #     security: []
  #     servers:
  #       - url: http://localhost:8002
