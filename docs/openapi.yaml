components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token issued by the Control Plane after successful agent authentication.
        The token contains agent identity, permissions, and resource scopes.
    
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        API Key authentication for CLI and administrative operations.
        Format: "Bearer YOUR_API_TOKEN"
    
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Token
      description: |
        Internal API key for service-to-service communication between
        the Control Plane and Gateway.

  schemas:
    # --- Agent Schemas ---
    AgentCreate:
      type: object
      required:
        - public_key
      properties:
        agent_id:
          type: string
          description: Optional agent ID. If not provided, one will be generated.
          example: "agent-custom-001"
        name:
          type: string
          maxLength: 255
          example: "MyAwesomeAgent"
          description: Human-readable name for the agent
        description:
          type: string
          example: "Agent for processing order data"
          description: Optional description of the agent's purpose
        public_key:
          type: string
          format: base64
          description: Base64-encoded Ed25519 public key (32 bytes)
          example: "AAAAC3NzaC1lZDI1NTE5AAAAIDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    
    Agent:
      type: object
      properties:
        agent_id:
          type: string
          example: "agent-ebd9cd4a-1234-5678-90ab-cdef01234567"
        name:
          type: string
          example: "MyAwesomeAgent"
        description:
          type: string
          example: "Agent for processing order data"
        public_key:
          type: string
          format: base64
          example: "AAAAC3NzaC1lZDI1NTE5AAAAIDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        status:
          type: string
          example: "active"
          enum: [active, inactive, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, revoked]
    
    AgentList:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        total:
          type: integer
          description: Total number of agents returned
    
    # --- Authentication Schemas ---
    ChallengeRequest:
      type: object
      required:
        - agent_id
      properties:
        agent_id:
          type: string
          example: "agent-ebd9cd4a-1234-5678-90ab-cdef01234567"
    
    ChallengeResponse:
      type: object
      properties:
        nonce:
          type: string
          description: Single-use nonce that must be signed by the agent
          example: "2024-01-15T10:30:00Z-agent-ebd9cd4a-1234567890abcdef"
    
    TokenRequest:
      type: object
      required:
        - agent_id
        - nonce
        - signature
      properties:
        agent_id:
          type: string
          example: "agent-ebd9cd4a-1234-5678-90ab-cdef01234567"
        nonce:
          type: string
          example: "2024-01-15T10:30:00Z-agent-ebd9cd4a-1234567890abcdef"
        signature:
          type: string
          format: base64
          description: Base64-encoded Ed25519 signature of the nonce
          example: "MEUCIQCxxx..."
    
    Token:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token with embedded agent permissions
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"
    
    # --- Delegation Schemas ---
    DelegationRequest:
      type: object
      required:
        - target_agent_id
        - resource
        - permissions
        - ttl_seconds
      properties:
        target_agent_id:
          type: string
          example: "agent-target-1234"
        resource:
          type: string
          example: "openai-api"
        permissions:
          type: array
          items:
            type: string
          example: ["read", "write"]
        ttl_seconds:
          type: integer
          example: 3600
          description: Time-to-live for the delegation in seconds
    
    DelegationResponse:
      type: object
      properties:
        delegation_token:
          type: string
          description: Macaroon delegation token
          example: "MDAxY2xvY2F0aW9uIGh0dHA6Ly9leGFtcGxlLm9yZy8KMDAyY2lkZW50aWZpZXIg..."
    
    # --- Bootstrap Schemas ---
    KubernetesBootstrapRequest:
      type: object
      required:
        - sat
      properties:
        sat:
          type: string
          description: Kubernetes Service Account Token
          example: "eyJhbGciOiJSUzI1NiIs..."
    
    AWSBootstrapRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Base64 encoded, presigned AWS STS GetCallerIdentity request
          example: "eyJhbGciOiJSUzI1NiIs..."
    
    AzureBootstrapRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Azure Instance Metadata Service (IMDS) token
          example: "eyJhbGciOiJSUzI1NiIs..."
    
    DockerBootstrapRequest:
      type: object
      required:
        - container_id
        - runtime_token
      properties:
        container_id:
          type: string
          description: Docker container ID
          example: "a1b2c3d4e5f6"
        runtime_token:
          type: string
          description: Runtime-generated token for container identity verification
          example: "runtime-token-abc123"
    
    BootstrapResponse:
      type: object
      properties:
        agent_id:
          type: string
          example: "agent-bootstrapped-1234"
        private_key_b64:
          type: string
          format: base64
          description: Base64 encoded private key (returned only once)
          example: "MC4CAQAwBQYDK2VwBCIEIA..."
        public_key_b64:
          type: string
          format: base64
          description: Base64 encoded public key
          example: "MCowBQYDK2VwAyEA..."
    
    BootstrapError:
      type: object
      properties:
        error:
          type: string
          example: "token_validation_failed"
        message:
          type: string
          example: "Token validation failed"
        error_code:
          type: string
          example: "BOOTSTRAP_001"
        platform:
          type: string
          example: "kubernetes"
        correlation_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
    
    # --- Vault & Credential Schemas ---
    SecretStoreRequest:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          example: "openai-api-key"
        value:
          type: string
          example: "sk-..."
        secret_metadata:
          type: object
          description: Additional metadata for the secret
          additionalProperties: true
          example:
            target_base_url: "https://api.openai.com"
            description: "OpenAI API key for production"
            labels:
              env: prod
    
    SecretStoreResponse:
      type: object
      properties:
        name:
          type: string
          example: "openai-api-key"
        message:
          type: string
          example: "Secret stored successfully"
    
    CredentialIssueRequest:
      type: object
      required:
        - agent_id
        - ephemeral_public_key
        - signature
        - ttl
      properties:
        agent_id:
          type: string
          example: "agent-ebd9cd4a-1234"
        ephemeral_public_key:
          type: string
          format: base64
          description: Base64-encoded ephemeral Ed25519 public key (32 bytes)
          example: "AAAAC3NzaC1lZDI1NTE5AAAAIEPH..."
        signature:
          type: string
          format: base64
          description: Base64-encoded signature (64 bytes)
          example: "MEUCIQCxxx..."
        ttl:
          type: integer
          minimum: 1
          description: Time-to-live in seconds
          example: 3600
        scope:
          type: string
          example: "read:secrets:prod/app1"
        origin_context:
          type: object
          description: Optional context about the request origin
          additionalProperties: true
          example:
            hostname: "agent-host-1"
            ip: "192.168.1.100"
    
    CredentialIssueResponse:
      type: object
      properties:
        credential_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        agent_id:
          type: string
          example: "agent-ebd9cd4a-1234"
        ephemeral_public_key:
          type: string
          format: base64
          example: "AAAAC3NzaC1lZDI1NTE5AAAAIEPH..."
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          example: "active"
        scope:
          type: string
          example: "read:secrets:prod/app1"
        origin_context:
          type: object
          additionalProperties: true
          example:
            hostname: "agent-host-1"
            ip: "192.168.1.100"
        secret_value:
          type: string
          nullable: true
          description: The secret value if this credential was issued for secret access
    
    CredentialRevokeResponse:
      type: object
      properties:
        credential_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          example: "revoked"
          enum: [revoked, already_revoked, revocation_failed]
    VerificationResponse:
      type: object
      properties:
        credential_id:
          type: string
        status:
          type: string
          example: "valid"
        is_valid:
          type: boolean
    
    # --- Policy Schemas ---
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          example: "agent-ebd9cd4a-1234"
        effect:
          type: string
          example: "allow"
          enum: [allow, deny]
        actions:
          type: array
          items:
            type: string
          example: ["read", "write"]
        resources:
          type: array
          items:
            type: string
          example: ["openai-api", "secrets:prod/*"]
        conditions:
          type: object
          additionalProperties: true
          description: Optional conditions for policy evaluation
        created_at:
          type: string
          format: date-time
    PolicyCreate:
      type: object
      required:
        - name
        - agent_id
        - actions
        - resources
      properties:
        name:
          type: string
        agent_id:
          type: string
        effect:
          type: string
          enum: [allow, deny]
          default: allow
        actions:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    
    AttestationPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          example: "kubernetes"
          enum: [kubernetes, aws, azure, docker]
        selector:
          type: object
          description: Platform-specific selector criteria
          additionalProperties: true
          example:
            namespace: "production"
            service_account: "ai-agents"
        effect:
          type: string
          example: "allow"
          enum: [allow, deny]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    # --- Error Schemas ---
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Error message
          example: "Agent not found"
        error_code:
          type: string
          description: Machine-readable error code
          example: "AGENT_NOT_FOUND"
        correlation_id:
          type: string
          format: uuid
          description: Unique ID for tracking this error
          example: "123e4567-e89b-12d3-a456-426614174000"

  responses:
    BadRequest:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Invalid input parameters"
            error_code: "BAD_REQUEST"

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Could not validate credentials"
            error_code: "UNAUTHORIZED"

    NotFound:
      description: Not Found - Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Resource not found"
            error_code: "NOT_FOUND"

    InternalServerError:
      description: Internal Server Error - Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Internal server error"
            error_code: "INTERNAL_ERROR"

