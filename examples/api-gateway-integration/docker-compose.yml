version: '3.8'

networks:
  deepsecure_kong_net:
    driver: bridge

services:
  # 1. DeepSecure Control Plane and its Database
  control-db:
    image: postgres:15-alpine
    container_name: deepsecure_control_db_example
    environment:
      POSTGRES_USER: deepsecure_user
      POSTGRES_PASSWORD: deepsecure_password
      POSTGRES_DB: deeptrail_controldb
    ports:
      - "5435:5432" # Use a different port to avoid conflicts
    networks:
      - deepsecure_kong_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsecure_user -d deeptrail_controldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  deeptrail-control:
    build:
      context: ../../deeptrail-control
    container_name: deepsecure_control_app_example
    ports:
      - "8001:8001" # Exposing on 8001, to keep 8000 free for Kong
    depends_on:
      control-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://deepsecure_user:deepsecure_password@control-db/deeptrail_controldb
      - SECRET_KEY=your-secret-key-for-jwt
      - BACKEND_API_TOKEN=DEFAULT_QUICKSTART_TOKEN
      - POLICY_PATH=/app/policies.yml
    volumes:
      - ../../deeptrail-control/policies.yml:/app/policies.yml:ro
    networks:
      - deepsecure_kong_net

  # 2. Kong Gateway and its Database
  kong-db:
    image: postgres:13
    container_name: kong_db_example
    environment:
      - POSTGRES_DB=kong
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=kong
    networks:
      - deepsecure_kong_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong/kong-gateway:3.4.1
    command: "kong migrations bootstrap"
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-db
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
    networks:
      - deepsecure_kong_net

  kong:
    image: kong/kong-gateway:3.4.1
    container_name: kong_gateway_example
    depends_on:
      - kong-migrations
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-db
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
      - KONG_PLUGINS=bundled,pre-function # Ensure pre-function plugin is available
    ports:
      - "8000:8000"   # Proxy
      - "8443:8443"   # Proxy SSL
      - "8002:8001"   # Admin API
      - "8444:8444"   # Admin API SSL
    networks:
      - deepsecure_kong_net

  # 3. The Mock API Service to be Protected
  my-api-service:
    build:
      context: .
      dockerfile: Dockerfile.mock_api
    container_name: mock_api_service_example
    networks:
      - deepsecure_kong_net

  # 4. Kong configuration service (runs after Kong is up)
  kong-configurator:
    build:
      context: .
      dockerfile: Dockerfile.configurator
    container_name: kong_configurator_example
    depends_on:
      - kong
      - my-api-service
      - deeptrail-control
    networks:
      - deepsecure_kong_net


